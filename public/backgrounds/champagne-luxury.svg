<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="cl-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf4e9"/>
      <stop offset="42%" stop-color="#f0e2c7"/>
      <stop offset="75%" stop-color="#e6d3ae"/>
      <stop offset="100%" stop-color="#f7eeda"/>
    </linearGradient>

    <!-- Keeps the centre quiet: a broad, low-contrast wash that gently
         flattens whatever sits behind it, so text placed there always
         reads cleanly regardless of the line/glow detail near the edges. -->
    <radialGradient id="cl-calm" cx="0.5" cy="0.48" r="0.42">
      <stop offset="0%" stop-color="#fbf6ec" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fbf6ec" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbf6ec" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cl-gold-tl" cx="0.06" cy="0.08" r="0.5">
      <stop offset="0%" stop-color="#d9b364" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#cfa860" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cfa860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cl-gold-br" cx="0.94" cy="0.94" r="0.55">
      <stop offset="0%" stop-color="#d9b364" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#cfa860" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cfa860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cl-gold-tr" cx="0.96" cy="0.05" r="0.4">
      <stop offset="0%" stop-color="#e6c88a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#e6c88a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cl-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a45f" stop-opacity="0"/>
      <stop offset="18%" stop-color="#c9a45f" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e2c07a" stop-opacity="0.7"/>
      <stop offset="82%" stop-color="#c9a45f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a45f" stop-opacity="0"/>
    </linearGradient>

    <filter id="cl-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#cl-base)"/>
  <rect width="1440" height="900" fill="url(#cl-gold-tl)"/>
  <rect width="1440" height="900" fill="url(#cl-gold-br)"/>
  <rect width="1440" height="900" fill="url(#cl-gold-tr)"/>

  <!-- Restrained fine gold lines: elegant flowing forms concentrated near
       the outer edges/corners, deliberately thinning out and staying clear
       of the centre so nothing competes with text placed over the panel. -->
  <g fill="none" stroke="url(#cl-line)" stroke-linecap="round">
    <path d="M -60,120 C 220,40 360,180 620,90" stroke-width="1.6"/>
    <path d="M -60,210 C 180,260 300,140 560,200" stroke-width="1.1"/>
    <path d="M -80,60 C 140,10 260,70 420,20" stroke-width="1.3"/>
    <path d="M 900,60 C 1080,140 1180,40 1500,110" stroke-width="1.6"/>
    <path d="M 950,180 C 1120,110 1240,220 1500,170" stroke-width="1.1"/>
    <path d="M 1020,-20 C 1160,50 1280,-10 1440,40" stroke-width="1.3"/>
    <path d="M -60,700 C 180,760 320,660 600,740" stroke-width="1.6"/>
    <path d="M -80,810 C 160,840 280,760 500,820" stroke-width="1.1"/>
    <path d="M -60,860 C 200,900 360,830 640,880" stroke-width="1"/>
    <path d="M 880,760 C 1060,700 1180,800 1500,730" stroke-width="1.6"/>
    <path d="M 920,860 C 1100,820 1220,890 1500,850" stroke-width="1.1"/>
    <path d="M 1000,920 C 1160,870 1280,930 1440,890" stroke-width="1"/>
  </g>

  <rect width="1440" height="900" fill="url(#cl-calm)"/>
  <rect width="1440" height="900" filter="url(#cl-grain)" opacity="0.045" style="mix-blend-mode:overlay"/>
</svg>
