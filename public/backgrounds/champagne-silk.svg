<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="cs-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe4"/>
      <stop offset="38%" stop-color="#e2d3bd"/>
      <stop offset="70%" stop-color="#cfbca1"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>

    <linearGradient id="cs-fold-a" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fffaf1" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cs-fold-b" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9c876b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8f7a5f" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9c876b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cs-fold-c" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#c9a962" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a962" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#c9a962" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cs-gold" cx="0.84" cy="0.16" r="0.5">
      <stop offset="0%" stop-color="#e3c47f" stop-opacity="0.62"/>
      <stop offset="55%" stop-color="#d0ad6a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9a962" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cs-taupe" cx="0.12" cy="0.82" r="0.55">
      <stop offset="0%" stop-color="#8b7761" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b7761" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cs-calm" cx="0.5" cy="0.5" r="0.46">
      <stop offset="0%" stop-color="#fbf5ea" stop-opacity="0.62"/>
      <stop offset="70%" stop-color="#f6eee0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f6eee0" stop-opacity="0"/>
    </radialGradient>

    <filter id="cs-silk" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0075" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="165" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="cs-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#cs-base)"/>

  <g filter="url(#cs-silk)">
    <rect x="-200" y="40" width="1840" height="210" fill="url(#cs-fold-a)" transform="rotate(-9 720 450)"/>
    <rect x="-200" y="330" width="1840" height="180" fill="url(#cs-fold-b)" transform="rotate(-13 720 450)"/>
    <rect x="-200" y="560" width="1840" height="230" fill="url(#cs-fold-a)" transform="rotate(-6 720 450)"/>
    <rect x="-200" y="760" width="1840" height="160" fill="url(#cs-fold-c)" transform="rotate(-11 720 450)"/>
    <rect x="-200" y="180" width="1840" height="120" fill="url(#cs-fold-c)" transform="rotate(4 720 450)"/>
  </g>

  <rect width="1440" height="900" fill="url(#cs-gold)"/>
  <rect width="1440" height="900" fill="url(#cs-taupe)"/>
  <rect width="1440" height="900" fill="url(#cs-calm)"/>

  <rect width="1440" height="900" filter="url(#cs-grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
