<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <!--
    Pearl Studio: the scoped background for the Clear Glass + Warm Studio
    experiment only. Soft sculptural folds in pearl-white and warm off-white,
    lit from the upper left, with restrained silver and champagne undertones.

    Built as broad curved bands rather than a photograph: the point is to give
    the panels something with real form to be transparent ABOUT, while staying
    quiet enough to read dark ink over. Mid-tones sit where the panels will be,
    so their transparency is visible rather than implied.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="0.38" stop-color="#f3eee7"/>
      <stop offset="0.72" stop-color="#e4dbcd"/>
      <stop offset="1" stop-color="#d2c5b3"/>
    </linearGradient>

    <!-- Daylight pooling from the upper left. -->
    <radialGradient id="daylight" cx="0.15" cy="0.06" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#fdfaf5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Fold shading: champagne in the trough, pearl on the crest. -->
    <linearGradient id="foldA" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#dbcdb8" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#b2a189" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="foldB" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#ccbba3" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#9c8a72" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="foldC" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#f7f2ea" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#bdab93" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8b7a62" stop-opacity="0.56"/>
    </linearGradient>

    <!-- Silver rim on a crest: a thin bright line, not a glow. -->
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#fffdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softer" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="crisp" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>

  <!-- Deep sculptural forms, furthest back. -->
  <g filter="url(#softer)">
    <path d="M-120 700 C 240 560, 430 780, 760 660 C 1050 556, 1240 690, 1760 560 L1760 980 L-120 980 Z"
          fill="url(#foldC)"/>
    <ellipse cx="1330" cy="250" rx="420" ry="300" fill="#efe7db" opacity="0.75"/>
  </g>

  <!-- Mid folds: these are the shapes meant to be seen THROUGH the panels. -->
  <g filter="url(#soft)">
    <path d="M-80 240 C 260 120, 470 330, 780 250 C 1080 172, 1290 330, 1700 230 L1700 470 C 1280 560, 1060 400, 760 470 C 460 540, 250 350, -80 460 Z"
          fill="url(#foldA)" opacity="0.9"/>
    <path d="M-80 520 C 300 430, 520 620, 880 540 C 1200 470, 1420 610, 1700 520 L1700 700 C 1400 780, 1180 650, 880 720 C 540 800, 300 620, -80 720 Z"
          fill="url(#foldB)" opacity="0.72"/>
    <path d="M980 -60 C 1120 160, 1010 360, 1180 520 C 1320 650, 1300 800, 1420 960 L1700 960 L1700 -60 Z"
          fill="url(#foldA)" opacity="0.55"/>
  </g>

  <!-- Crest highlights: thin, following the folds, never a full outline. -->
  <g filter="url(#crisp)" opacity="0.7">
    <path d="M-80 250 C 260 130, 470 340, 780 260 C 1080 182, 1290 340, 1700 240"
          fill="none" stroke="url(#crest)" stroke-width="7"/>
    <path d="M-80 530 C 300 440, 520 630, 880 550 C 1200 480, 1420 620, 1700 530"
          fill="none" stroke="url(#crest)" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- Daylight last, so the upper left reads as the source. -->
  <rect width="1600" height="900" fill="url(#daylight)"/>

  <!-- Faintest settling of warmth into the lower right, for depth. -->
  <ellipse cx="1420" cy="880" rx="620" ry="340" fill="#a8927a" opacity="0.3" filter="url(#softer)"/>
</svg>
