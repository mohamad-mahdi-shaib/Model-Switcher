<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="ab-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150f1c"/>
      <stop offset="36%" stop-color="#2a1b34"/>
      <stop offset="70%" stop-color="#1d1327"/>
      <stop offset="100%" stop-color="#100b16"/>
    </linearGradient>

    <linearGradient id="ab-fold-a" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#6d4193" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7d4da6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d4193" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ab-fold-b" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4b2442" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5c2c50" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4b2442" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ab-fold-c" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#d98fa2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d98fa2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d98fa2" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ab-violet" cx="0.8" cy="0.2" r="0.52">
      <stop offset="0%" stop-color="#8a55b5" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#6d4193" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5a3479" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-plum" cx="0.15" cy="0.78" r="0.55">
      <stop offset="0%" stop-color="#57284b" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#57284b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-rose" cx="0.9" cy="0.84" r="0.32">
      <stop offset="0%" stop-color="#e29cae" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e29cae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-calm" cx="0.5" cy="0.52" r="0.46">
      <stop offset="0%" stop-color="#0d0812" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0d0812" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d0812" stop-opacity="0"/>
    </radialGradient>

    <filter id="ab-silk" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0030 0.0072" numOctaves="3" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="175" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <filter id="ab-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="14"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#ab-base)"/>

  <g filter="url(#ab-silk)">
    <rect x="-200" y="30" width="1840" height="220" fill="url(#ab-fold-a)" transform="rotate(-8 720 450)"/>
    <rect x="-200" y="310" width="1840" height="200" fill="url(#ab-fold-b)" transform="rotate(-13 720 450)"/>
    <rect x="-200" y="550" width="1840" height="240" fill="url(#ab-fold-a)" transform="rotate(-6 720 450)"/>
    <rect x="-200" y="750" width="1840" height="150" fill="url(#ab-fold-c)" transform="rotate(-11 720 450)"/>
    <rect x="-200" y="160" width="1840" height="110" fill="url(#ab-fold-c)" transform="rotate(5 720 450)"/>
  </g>

  <rect width="1440" height="900" fill="url(#ab-violet)"/>
  <rect width="1440" height="900" fill="url(#ab-plum)"/>
  <rect width="1440" height="900" fill="url(#ab-rose)"/>
  <rect width="1440" height="900" fill="url(#ab-calm)"/>

  <rect width="1440" height="900" filter="url(#ab-grain)" opacity="0.06" style="mix-blend-mode:overlay"/>
</svg>
