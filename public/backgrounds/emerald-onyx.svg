<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="eo-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1412"/>
      <stop offset="35%" stop-color="#11241d"/>
      <stop offset="68%" stop-color="#0d1a17"/>
      <stop offset="100%" stop-color="#070d0c"/>
    </linearGradient>

    <linearGradient id="eo-fold-a" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#0f6b4e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#128a63" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f6b4e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eo-fold-b" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1b2428" stop-opacity="0"/>
      <stop offset="50%" stop-color="#232e33" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1b2428" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eo-fold-c" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#cdb682" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cdb682" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#cdb682" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="eo-emerald" cx="0.82" cy="0.18" r="0.52">
      <stop offset="0%" stop-color="#10906a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0c5f47" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a4a37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eo-deep" cx="0.14" cy="0.8" r="0.55">
      <stop offset="0%" stop-color="#0a4a37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4a37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eo-champagne" cx="0.93" cy="0.86" r="0.3">
      <stop offset="0%" stop-color="#d9c48f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d9c48f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eo-calm" cx="0.5" cy="0.52" r="0.46">
      <stop offset="0%" stop-color="#050a09" stop-opacity="0.26"/>
      <stop offset="70%" stop-color="#050a09" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050a09" stop-opacity="0"/>
    </radialGradient>

    <filter id="eo-silk" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0068" numOctaves="3" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="180" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="eo-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#eo-base)"/>

  <g filter="url(#eo-silk)">
    <rect x="-200" y="20" width="1840" height="230" fill="url(#eo-fold-a)" transform="rotate(-10 720 450)"/>
    <rect x="-200" y="300" width="1840" height="190" fill="url(#eo-fold-b)" transform="rotate(-14 720 450)"/>
    <rect x="-200" y="540" width="1840" height="250" fill="url(#eo-fold-a)" transform="rotate(-5 720 450)"/>
    <rect x="-200" y="740" width="1840" height="150" fill="url(#eo-fold-c)" transform="rotate(-12 720 450)"/>
    <rect x="-200" y="150" width="1840" height="110" fill="url(#eo-fold-c)" transform="rotate(5 720 450)"/>
  </g>

  <rect width="1440" height="900" fill="url(#eo-emerald)"/>
  <rect width="1440" height="900" fill="url(#eo-deep)"/>
  <rect width="1440" height="900" fill="url(#eo-champagne)"/>
  <rect width="1440" height="900" fill="url(#eo-calm)"/>

  <rect width="1440" height="900" filter="url(#eo-grain)" opacity="0.06" style="mix-blend-mode:overlay"/>
</svg>
